<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>confirmed</title>

<style>
body{
    margin:0;
    font-family: Georgia, serif;
    overflow:hidden;
}

.hero{
    width:100vw;
    height:100vh;
    background: linear-gradient(to bottom, #020b1a, #061a3a, #0b2a55);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    text-align:center;
    position:relative;
    gap:20px;
}

/* GIF */
.gif{
    width:200px;
}

/* CARD */
.card{
    background:white;
    color:#0b2a55;
    padding:30px;
    border-radius:20px;
    width:380px;
    box-sizing:border-box;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:12px;
}

/* TITOLO */
.title{
    font-size:1.4rem;
    font-weight:bold;
    text-align:center;
    margin-bottom:10px;
}

/* RIGHE */
.row{
    font-size:1.1rem;
}

/* STELLINE */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:yellow;
    border-radius:50%;
    box-shadow:0 0 6px yellow;
}
</style>
</head>

<body>

<div class="hero">

<img class="gif" src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExMmJlZXNoNWlzNWJvdnN3YWZhN3FrNnl2bjI2ZmxzbWlkOGZvbzNmYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l2Sq5GffrCyUMEXjW/giphy.gif">

<div class="card">

<div class="title">appuntamento confermato 💙</div>

<div class="row" id="date"></div>
<div class="row" id="time"></div>
<div class="row" id="where"></div>

</div>

</div>

<script>

/* stelle */
for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');
    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";
    document.querySelector('.hero').appendChild(star);
}

/* DATI */
const dateRaw = localStorage.getItem("date");
const time = localStorage.getItem("time");
const where = JSON.parse(localStorage.getItem("where") || "[]");

/* FORMATO DATA ITALIANO */
function formatDate(dateStr){
    if(!dateStr) return "non selezionata";

    const d = new Date(dateStr);
    return d.toLocaleDateString("it-IT", {
        day:"numeric",
        month:"long",
        year:"numeric"
    });
}

/* OUTPUT */
document.getElementById("date").innerText =
    "📅 " + formatDate(dateRaw);

document.getElementById("time").innerText =
    "🕑 " + (time || "non selezionato");

document.getElementById("where").innerText =
    "📌 " + (where.length ? where.join(", ") : "non selezionato");

</script>

</body>
</html>
