<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ti va di uscire?</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family: Georgia, serif;
}

/* SFONDO */
.hero{
    width:100vw;
    height:100vh;
    background: linear-gradient(to bottom, #020b1a, #061a3a, #0b2a55);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    position:relative;
    text-align:center;
    color:white;
}

/* TESTO */
h1{
    font-size:3rem;
    margin-bottom:20px;
}

/* GATTO */
img{
    width:180px;
    margin-bottom:25px;
    border-radius:15px;
}

/* BOTTONI */
.buttons{
    display:flex;
    gap:20px;
    position:relative;
    z-index:10;
}

.box{
    background:white;
    color:#0b2a55;
    padding:15px 40px;
    border-radius:12px;
    font-size:1.2rem;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
}

.box:hover{
    transform:scale(1.05);
}

/* NO che scappa */
#no{
    position:absolute;
}

/* STELLE */
.star{
    position:absolute;
    background:yellow;
    border-radius:50%;
    animation:twinkle 3s infinite;
    box-shadow: 0 0 6px yellow;
}

@keyframes twinkle{
    0%,100%{opacity:0.3; transform:scale(1);}
    50%{opacity:1; transform:scale(1.8);}
}
</style>
</head>

<body>

<div class="hero">

    <h1>Ti va di uscire?</h1>

    <!-- GATTO (gif carina) -->
    <img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" alt="gatto">

    <div class="buttons">
        <div class="box" onclick="yes()">Sì</div>
        <div class="box" id="no">No</div>
    </div>

</div>

<script>

// STELLE GIALLE
for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');

    const size=Math.random()*3+1;

    star.style.width=size+'px';
    star.style.height=size+'px';

    star.style.left=Math.random()*100+'%';
    star.style.top=Math.random()*100+'%';

    star.style.animationDelay=Math.random()*3+'s';

    document.querySelector('.hero').appendChild(star);
}

// BOTTONI
function yes(){
    alert("💙 perfetto 💙");
}

// NO CHE SCAPPA
const noBtn = document.getElementById("no");

document.addEventListener("mousemove", function(e){

    const x = noBtn.getBoundingClientRect();

    const dist = Math.hypot(e.clientX - (x.left+x.width/2), e.clientY - (x.top+x.height/2));

    if(dist < 80){
        const maxX = window.innerWidth - 100;
        const maxY = window.innerHeight - 50;

        noBtn.style.left = Math.random()*maxX + "px";
        noBtn.style.top = Math.random()*maxY + "px";
    }
});

</script>

</body>
</html>
