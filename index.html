<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ti va di uscire?</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family: Georgia, serif;
}

.hero{
    width:100vw;
    height:100vh;
    background: linear-gradient(to bottom, #020b1a, #061a3a, #0b2a55);
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    color:white;
}

h1{
    font-size:3rem;
    margin-bottom:20px;
    text-transform: lowercase;
    text-shadow:0 0 10px #5aa7ff;
}

img{
    width:170px;
    margin-bottom:20px;
}

.buttons{
    display:flex;
    gap:20px;
}

.box{
    background:white;
    color:#0b2a55;
    padding:12px 28px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 10px #5aa7ff;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:yellow;
    border-radius:50%;
    box-shadow:0 0 6px yellow;
}
</style>
</head>

<body>

<div class="hero">

<div class="container">

<h1>ti va di uscire?</h1>

<img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExdTQwN2Fmc2pxeDNpcjNsM2Z3bGJuZ20yMzI4bXAxNXpna2d2MHJoYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Ncn7y0xz7ZfAxEcEml/giphy.gif">

<div class="buttons">
    <div class="box" onclick="yes()">si</div>
    <div class="box">no</div>
</div>

</div>

</div>

<script>

function yes(){
    window.location.href = "where.html";
}

for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');
    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";
    document.querySelector('.hero').appendChild(star);
}

</script>

</body>
</html>
