<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ti va di uscire?</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family: Georgia, serif;
}

/* SFONDO */
.hero{
    width:100vw;
    height:100vh;
    background: linear-gradient(to bottom, #020b1a, #061a3a, #0b2a55);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    position:relative;
    text-align:center;
    color:white;
}

/* TESTO */
h1{
    font-size:3rem;
    margin-bottom:20px;
    text-transform: lowercase;
}

/* GATTO */
img{
    width:180px;
    margin-bottom:25px;
    border-radius:15px;
}

/* BOTTONI */
.box{
    background:white;
    color:#0b2a55;
    padding:15px 40px;
    border-radius:12px;
    font-size:1.2rem;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
    position:relative;
}

.box:hover{
    transform:scale(1.05);
}

.buttons{
    display:flex;
    gap:20px;
    z-index:10;
}

/* NO che scappa */
#no{
    position:absolute;
    left:60%;
    top:70%;
}

/* STELLE */
.star{
    position:absolute;
    background:yellow;
    border-radius:50%;
    animation:twinkle 3s infinite;
    box-shadow:0 0 6px yellow;
}

@keyframes twinkle{
    0%,100%{opacity:0.3; transform:scale(1);}
    50%{opacity:1; transform:scale(1.8);}
}
</style>
</head>

<body>

<div class="hero">

    <h1>ti va di uscire?</h1>

    <!-- GATTO SUPPLICANTE -->
    <img src="https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif" alt="gattino supplicante">

    <div class="buttons">
        <div class="box" onclick="yes()">si</div>
        <div class="box" id="no">no</div>
    </div>

</div>

<script>

// STELLE
for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');

    const size=Math.random()*3+1;

    star.style.width=size+'px';
    star.style.height=size+'px';

    star.style.left=Math.random()*100+'%';
    star.style.top=Math.random()*100+'%';

    star.style.animationDelay=Math.random()*3+'s';

    document.querySelector('.hero').appendChild(star);
}

// SI
function yes(){
    alert("💙 grazie 💙");
}

// NO CHE SI MUOVE SEMPRE (non sparisce mai)
const noBtn = document.getElementById("no");

document.addEventListener("mousemove", function(e){

    const rect = noBtn.getBoundingClientRect();

    const dist = Math.hypot(
        e.clientX - (rect.left + rect.width/2),
        e.clientY - (rect.top + rect.height/2)
    );

    if(dist < 100){
        const maxX = window.innerWidth - 120;
        const maxY = window.innerHeight - 60;

        noBtn.style.left = Math.random()*maxX + "px";
        noBtn.style.top = Math.random()*maxY + "px";
    }
});
</script>

</body>
</html>
