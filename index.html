<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ti va di uscire?</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family: Georgia, serif;
}

/* SFONDO */
.hero{
    width:100vw;
    height:100vh;
    background: linear-gradient(to bottom, #020b1a, #061a3a, #0b2a55);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
}

/* CENTRO */
.container{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
}

/* TESTO */
h1{
    font-size:3.2rem;
    margin-bottom:20px;
    text-transform: lowercase;
    text-shadow:0 0 10px #5aa7ff;
}

/* GATTO */
img{
    width:180px;
    margin-bottom:20px;
}

/* BOTTONI PERFETTAMENTE ALLINEATI */
.buttons{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:20px;
    align-items:center;
    justify-items:center;
    margin-top:10px;
    position:relative;
    width:260px;
}

/* BOX */
.box{
    background:white;
    color:#0b2a55;
    padding:15px 35px;
    border-radius:12px;
    font-size:1.3rem;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 10px #5aa7ff;
    user-select:none;
    width:100%;
    text-align:center;
}

/* SI normale */
#si{
    position:relative;
}

/* NO fuori dal flow ma non rompe layout */
#no{
    position:fixed;
}

/* STELLE */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:yellow;
    border-radius:50%;
    box-shadow:0 0 6px yellow;
}
</style>
</head>

<body>

<div class="hero">

    <div class="container">

        <h1>ti va di uscire?</h1>

        <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExdTQwN2Fmc2pxeDNpcjNsM2Z3bGJuZ20yMzI4bXAxNXpna2d2MHJoYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Ncn7y0xz7ZfAxEcEml/giphy.gif">

        <div class="buttons">
            <div class="box" id="si" onclick="yes()">si</div>
            <div class="box" id="no">no</div>
        </div>

    </div>

</div>

<script>

/* STELLE */
for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    document.querySelector('.hero').appendChild(star);
}

/* SI */
function yes(){
    alert("💙 grazie 💙");
}

/* NO che scappa senza rompere layout */
const noBtn = document.getElementById("no");

document.addEventListener("mousemove", function(e){

    const rect = noBtn.getBoundingClientRect();

    const dist = Math.hypot(
        e.clientX - (rect.left + rect.width/2),
        e.clientY - (rect.top + rect.height/2)
    );

    if(dist < 120){

        const padding = 120;

        const maxX = window.innerWidth - padding;
        const maxY = window.innerHeight - padding;

        noBtn.style.left = Math.random()*maxX + "px";
        noBtn.style.top = Math.random()*maxY + "px";
    }
});
</script>

</body>
</html>
