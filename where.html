<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>where</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family: Georgia, serif;
}

.hero{
    width:100vw;
    height:100vh;
    background: linear-gradient(to bottom, #020b1a, #061a3a, #0b2a55);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    position:relative;
}

h1{
    font-size:3rem;
    margin-bottom:30px;
    text-transform:lowercase;
    text-shadow:0 0 10px #5aa7ff;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    width:360px;
    z-index:2;
}

.grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:12px;
}

.item{
    background:#0b2a55;
    color:white;
    font-size:1.8rem;
    border-radius:12px;
    padding:18px;
    text-align:center;
    cursor:pointer;
}

.item.selected{
    background:#5aa7ff;
    color:#0b2a55;
}

/* STELLINE */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:yellow;
    border-radius:50%;
    box-shadow:0 0 6px yellow;
}
</style>
</head>

<body>

<div class="hero">

<h1>dove andiamo?</h1>

<div class="card">

    <div class="grid">

        <div class="item">🍕</div>
        <div class="item">🍣</div>
        <div class="item">🍔</div>
        <div class="item">🥐</div>
        <div class="item">🥞🍳</div>
        <div class="item">🍦</div>
        <div class="item">⛳️</div>
        <div class="item">🎥</div>
        <div class="item">🎢</div>
        <div class="item">🏝️</div>
        <div class="item">🏃🏻‍♀️‍➡️🏃🏻‍➡️</div>
        <div class="item">🌕✨</div>
        <div class="item">⛸️</div>
        <div class="item">🎮</div>
        <div class="item">🛍️</div>

    </div>

</div>

</div>

<script>

/* STELLINE */
for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    document.querySelector('.hero').appendChild(star);
}

document.querySelectorAll(".item").forEach(el => {
    el.addEventListener("click", () => {
        el.classList.toggle("selected");
    });
});

</script>

</body>
</html>
