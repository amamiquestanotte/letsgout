<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>when</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family: Georgia, serif;
}

.hero{
    width:100vw;
    height:100vh;
    background: linear-gradient(to bottom, #020b1a, #061a3a, #0b2a55);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    position:relative;
}

h1{
    font-size:3rem;
    margin-bottom:30px;
    text-transform:lowercase;
    text-shadow:0 0 10px #5aa7ff;
}

/* CARD */
.card{
    background:white;
    border-radius:20px;
    padding:30px;
    width:320px;
    color:#0b2a55;
    display:flex;
    flex-direction:column;
    gap:15px;
    text-align:center;
    box-sizing:border-box;
}

/* LABELS: blu + grassetto */
.label{
    font-weight:bold;
    color:#0b2a55;
    font-size:1rem;
}

input{
    padding:10px;
    border-radius:10px;
    border:2px solid #0b2a55;
    font-family:inherit;
}

/* BOTTONE FUORI DAL RQUADRO */
.confirm-btn{
    margin-top:25px;
    padding:16px 36px;
    border:none;
    border-radius:12px;
    background:white;
    color:#0b2a55;
    font-weight:bold;
    font-size:1.2rem;
    cursor:pointer;
    box-shadow:0 0 10px #5aa7ff;
    transition:0.2s;
}

.confirm-btn:hover{
    transform:scale(1.05);
}

/* STELLINE */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:yellow;
    border-radius:50%;
    box-shadow:0 0 6px yellow;
}
</style>
</head>

<body>

<div class="hero">

<h1>quando sei libero?</h1>

<div class="card">

    <div class="label">data</div>
    <input type="date" id="date">

    <div class="label">ora</div>
    <input type="time" id="time">

</div>

<button class="confirm-btn" onclick="finish()">conferma</button>

</div>

<script>

/* stelle */
for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    document.querySelector('.hero').appendChild(star);
}

function finish(){

    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;

    if(!date || !time){
        alert("scegli data e ora 💙");
        return;
    }

    localStorage.setItem("date", date);
    localStorage.setItem("time", time);

    window.location.href = "confirmed.html";
}

</script>

</body>
</html>
