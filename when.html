<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quando sei libero?</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family: Georgia, serif;
}

.hero{
    width:100vw;
    height:100vh;
    background: linear-gradient(to bottom, #020b1a, #061a3a, #0b2a55);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    position:relative;
}

h1{
    font-size:3rem;
    margin-bottom:30px;
    text-transform:lowercase;
    text-shadow:
        0 0 5px #7db7ff,
        0 0 10px #5aa7ff,
        0 0 20px #3f8cff;
}

.card{
    background:white;
    border:3px solid #0b2a55;
    border-radius:20px;
    padding:30px;
    width:320px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    gap:18px;
    color:#0b2a55;
    text-align:center;
}

label{
    font-weight:bold;
    font-size:1rem;
}

input{
    padding:10px;
    border:2px solid #0b2a55;
    border-radius:10px;
    font-size:1rem;
    font-family:inherit;
}

/* bottone fuori dal riquadro */
.confirm-btn{
    margin-top:25px;
    padding:12px 28px;
    border-radius:12px;
    border:none;
    background:white;
    color:#0b2a55;
    font-size:1.1rem;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 10px #5aa7ff;
    transition:0.2s;
}

.confirm-btn:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="hero">

    <h1>quando sei libero?</h1>

    <div class="card">

        <label for="date">scegli una data</label>
        <input type="date" id="date">

        <label for="time">scegli un orario</label>
        <input type="time" id="time">

    </div>

    <button class="confirm-btn" onclick="conferma()">conferma</button>

</div>

<script>

/* BLOCCO SICUREZZA FLUSSO */
sessionStorage.setItem("flow", "true");

function conferma(){

    const data = document.getElementById("date").value;
    const ora = document.getElementById("time").value;

    if(!data || !ora){
        alert("scegli una data e un orario 💙");
        return;
    }

    localStorage.setItem("date", data);
    localStorage.setItem("time", ora);

    window.location.href = "where.html";
}

</script>

</body>
</html>
