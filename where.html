<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cosa facciamo?</title>

<style>
body{
    margin:0;
    font-family: Georgia, serif;
    overflow:hidden;
}

.hero{
    width:100vw;
    height:100vh;
    background: linear-gradient(to bottom, #020b1a, #061a3a, #0b2a55);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
}

h1{
    font-size:3rem;
    margin-bottom:25px;
    text-transform:lowercase;
    text-shadow:0 0 10px #5aa7ff;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    width:360px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:12px;
    width:100%;
}

.item{
    background:#0b2a55;
    color:white;
    font-size:1.8rem;
    border-radius:12px;
    padding:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    user-select:none;
    transition:0.2s;
}

.item:hover{
    transform:scale(1.05);
}

.item.selected{
    background:#5aa7ff;
    color:#0b2a55;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="hero">

<h1>where?</h1>

<div class="card">

    <div class="grid">

        <div class="item">🍕</div>
        <div class="item">🍣</div>
        <div class="item">🍔</div>
        <div class="item">🥐☕️</div>
        <div class="item">🥞🍳</div>
        <div class="item">🍦</div>
        <div class="item">⛳️</div>
        <div class="item">🎥🍿</div>
        <div class="item">🎢</div>
        <div class="item">🏝️</div>
        <div class="item">🏃🏻‍♀️‍➡️🏃🏻‍➡️</div>
        <div class="item">🌕✨</div>
        <div class="item">⛸️</div>
        <div class="item">🎮</div>
        <div class="item">🛍️</div>

    </div>

</div>

</div>

<script>

const items = document.querySelectorAll(".item");

items.forEach(el => {
    el.addEventListener("click", () => {

        // toggle selezione
        el.classList.toggle("selected");

        // salva tutte le selezioni
        const selected = [...document.querySelectorAll(".item.selected")]
            .map(x => x.innerText);

        localStorage.setItem("where", JSON.stringify(selected));
    });
});

</script>

</body>
</html>
