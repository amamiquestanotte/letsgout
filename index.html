<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ti va di uscire?</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family: Georgia, serif;
}

.hero{
    width:100vw;
    height:100vh;
    background: linear-gradient(to bottom, #020b1a, #061a3a, #0b2a55);
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    color:white;
}

h1{
    font-size:3rem;
    margin-bottom:20px;
    text-transform: lowercase;
    text-shadow:0 0 10px #5aa7ff;
}

img{
    width:170px;
    margin-bottom:20px;
}

/* BOTTONI CENTRATI */
.buttons{
    position:relative;
    width:220px;
    height:60px;
}

/* BOX */
.box{
    position:absolute;
    background:white;
    color:#0b2a55;
    padding:12px 28px;
    border-radius:12px;
    font-size:1.1rem;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 10px #5aa7ff;
    user-select:none;
    transition:0.2s;
}

.box:hover{
    transform:scale(1.05);
}

/* SI centrato */
#si{
    left:50%;
    top:50%;
    transform:translate(-110%, -50%);
}

/* NO centrato */
#no{
    left:50%;
    top:50%;
    transform:translate(10%, -50%);
}

/* STELLE */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:yellow;
    border-radius:50%;
    box-shadow:0 0 6px yellow;
}
</style>
</head>

<body>

<div class="hero">

    <div class="container">

        <h1>ti va di uscire?</h1>

        <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExdTQwN2Fmc2pxeDNpcjNsM2Z3bGJuZ20yMzI4bXAxNXpna2d2MHJoYiZlcD12MV9pbnRlcm5hbGZfYnlfaWQmY3Q9Zw/Ncn7y0xz7ZfAxEcEml/giphy.gif">

        <div class="buttons">
            <div class="box" id="si" onclick="yes()">si</div>
            <div class="box" id="no">no</div>
        </div>

    </div>

</div>

<script>

/* STELLE */
for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    document.querySelector('.hero').appendChild(star);
}

/* SI → ORA VA A WHERE */
function yes(){
    window.location.href = "where.html";
}

/* NO CHE SCAPPA */
const noBtn = document.getElementById("no");

noBtn.addEventListener("mouseenter", function () {

    const padding = 120;

    const x = Math.random() * (window.innerWidth - padding);
    const y = Math.random() * (window.innerHeight - padding);

    noBtn.style.position = "fixed";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
    noBtn.style.transform = "none";
});
</script>

</body>
</html>
