<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il Nostro Sito</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family: 'Georgia', serif;
}

.hero{
    position:relative;
    width:100vw;
    height:100vh;
    background: linear-gradient(
        to bottom,
        #021024,
        #052659,
        #1b3c73
    );
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

.content{
    z-index:10;
    padding:20px;
}

h1{
    font-size:4rem;
    margin-bottom:15px;
    text-shadow:0 0 15px rgba(255,255,255,.4);
}

p{
    font-size:1.3rem;
    margin-bottom:30px;
}

button{
    background:white;
    color:#052659;
    border:none;
    padding:15px 35px;
    border-radius:30px;
    font-size:1rem;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

/* Stelle */

.star{
    position:absolute;
    background:white;
    border-radius:50%;
    animation:twinkle 3s infinite;
}

@keyframes twinkle{
    0%,100%{
        opacity:0.2;
        transform:scale(1);
    }
    50%{
        opacity:1;
        transform:scale(1.5);
    }
}
</style>
</head>

<body>

<section class="hero">

<div class="content">
    <h1>Rebecca & ...</h1>
    <p>Ogni stella racconta una storia.</p>
    <button>Scopri di più</button>
</div>

</section>

<script>
for(let i=0;i<120;i++){

    const star=document.createElement('div');
    star.classList.add('star');

    const size=Math.random()*4+1;

    star.style.width=size+'px';
    star.style.height=size+'px';

    star.style.left=Math.random()*100+'%';
    star.style.top=Math.random()*100+'%';

    star.style.animationDelay=Math.random()*3+'s';

    document.querySelector('.hero').appendChild(star);
}
</script>

</body>
</html>
