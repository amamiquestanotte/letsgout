<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>confirmed</title>

<style>
body{
    margin:0;
    font-family: Georgia, serif;
    overflow:hidden;
}

.hero{
    width:100vw;
    height:100vh;
    background: linear-gradient(to bottom, #020b1a, #061a3a, #0b2a55);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    text-align:center;
    position:relative;
    gap:25px;
}

/* GIF */
.gif{
    width:200px;
}

/* CARD RIEPILOGO */
.card{
    background:white;
    color:#0b2a55;
    padding:30px;
    border-radius:20px;
    width:380px;
    box-sizing:border-box;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.row{
    font-size:1.1rem;
}

/* 🔥 BOX STYLE (uguale index) */
.box-btn{
    background:white;
    color:#0b2a55;
    padding:12px 28px;
    border-radius:12px;
    font-size:1.1rem;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 10px #5aa7ff;
    user-select:none;
    transition:0.2s;
}

.box-btn:hover{
    transform:scale(1.05);
}

/* STELLE */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:yellow;
    border-radius:50%;
    box-shadow:0 0 6px yellow;
}
</style>
</head>

<body>

<div class="hero">

<img class="gif" src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExMmJlZXNoNWlzNWJvdnN3YWZhN3FrNnl2bjI2ZmxzbWlkOGZvbzNmYiZlcD12MV9pbnRlcm5hbGZfYnlfaWQmY3Q9Zw/l2Sq5GffrCyUMEXjW/giphy.gif">

<div class="card">

<div class="row" id="date"></div>
<div class="row" id="time"></div>
<div class="row" id="where"></div>

</div>

<!-- BOX BUTTON ESTERNO -->
<div class="box-btn" onclick="sendTelegram()">
clicca qui per confermare 💌
</div>

</div>

<script>

/* stelle */
for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');
    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";
    document.querySelector('.hero').appendChild(star);
}

/* dati */
const dateRaw = localStorage.getItem("date");
const time = localStorage.getItem("time");
const where = JSON.parse(localStorage.getItem("where") || "[]");

/* format data */
function formatDate(dateStr){
    if(!dateStr) return "non selezionata";

    const d = new Date(dateStr);
    return d.toLocaleDateString("it-IT", {
        day:"numeric",
        month:"long",
        year:"numeric"
    });
}

/* render */
document.getElementById("date").innerText =
    "📅 " + formatDate(dateRaw);

document.getElementById("time").innerText =
    "🕑 " + (time || "non selezionato");

document.getElementById("where").innerText =
    "📌 " + (where.length ? where.join(", ") : "non selezionato");


/* TELEGRAM */
function sendTelegram(){

    const message =
`💙 appuntamento

📅 ${formatDate(dateRaw)}
🕑 ${time}
📌 ${where.join(", ")}`;

    const token = "8969842727:AAFZwkxtAT-LqhiloqrsxRKTwJfSsBkc0GU";
    const chat_id = "36109387";

    const url =
`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(message)}`;

    fetch(url)
        .then(() => alert("conferma inviata"))
        .catch(() => alert("errore"));
}

</script>

</body>
</html>
