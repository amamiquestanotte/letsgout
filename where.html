<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>where</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family: Georgia, serif;
}

.hero{
    width:100vw;
    height:100vh;
    background: linear-gradient(to bottom, #020b1a, #061a3a, #0b2a55);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
}

h1{
    font-size:3rem;
    margin-bottom:30px;
    text-transform:lowercase;
    text-shadow:0 0 10px #5aa7ff;
}

.card{
    background:white;
    border-radius:20px;
    padding:25px;
    width:360px;
}

.grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:12px;
}

.item{
    background:#0b2a55;
    color:white;
    font-size:1.6rem;
    border-radius:12px;
    padding:18px;
    text-align:center;
    cursor:pointer;
}

.item.selected{
    background:#5aa7ff;
    color:#0b2a55;
}

.confirm-btn{
    margin-top:25px;
    padding:12px 28px;
    border:none;
    border-radius:12px;
    background:white;
    color:#0b2a55;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 10px #5aa7ff;
}
</style>
</head>

<body>

<div class="hero">

<h1>dove andiamo?</h1>

<div class="card">

<div class="grid">

<div class="item">🍕</div>
<div class="item">🍣</div>
<div class="item">🍔</div>
<div class="item">🥐</div>
<div class="item">🥞🍳</div>
<div class="item">🍦</div>
<div class="item">⛳️</div>
<div class="item">🎥</div>
<div class="item">🎢</div>
<div class="item">🏝️</div>
<div class="item">🏃🏻‍♀️‍➡️🏃🏻‍➡️</div>
<div class="item">🌕✨</div>
<div class="item">⛸️</div>
<div class="item">🎮</div>
<div class="item">🛍️</div>

</div>

</div>

<button class="confirm-btn" onclick="goNext()">conferma</button>

</div>

<script>

document.querySelectorAll(".item").forEach(el=>{
    el.onclick=()=>el.classList.toggle("selected");
});

function goNext(){

    const selected=[...document.querySelectorAll(".item.selected")]
    .map(x=>x.innerText);

    localStorage.setItem("where", JSON.stringify(selected));

    window.location.href="when.html";
}

</script>

</body>
</html>
