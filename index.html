<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ti va di uscire?</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family: Georgia, serif;
}

/* SFONDO */
.hero{
    width:100vw;
    height:100vh;
    background: linear-gradient(to bottom, #020b1a, #061a3a, #0b2a55);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    color:white;
    position:relative;
}

/* TESTO */
h1{
    font-size:3.2rem;
    margin-bottom:20px;
    text-transform: lowercase;
    text-shadow: 0 0 10px #5aa7ff;
}

/* GATTO */
img{
    width:180px;
    margin-bottom:20px;
}

/* BOTTONI (SEMPRE AFFIANCATI) */
.buttons{
    display:flex;
    gap:20px;
    align-items:center;
    justify-content:center;
}

/* BOX */
.box{
    background:white;
    color:#0b2a55;
    padding:15px 45px;
    border-radius:12px;
    font-size:1.3rem;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 10px #5aa7ff;
}

/* NO che scappa */
#no{
    position:fixed;
    left:60%;
    top:60%;
}

/* STELLE */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:yellow;
    border-radius:50%;
    box-shadow:0 0 6px yellow;
    animation: twinkle 3s infinite;
}

@keyframes twinkle{
    0%,100%{opacity:0.3;}
    50%{opacity:1;}
}
</style>
</head>

<body>

<div class="hero">

    <h1>ti va di uscire?</h1>

    <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExdTQwN2Fmc2pxeDNpcjNsM2Z3bGJuZ20yMzI4bXAxNXpna2d2MHJoYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Ncn7y0xz7ZfAxEcEml/giphy.gif">

    <div class="buttons">
        <div class="box" onclick="yes()">si</div>
        <div class="box" id="no">no</div>
    </div>

</div>

<script>

/* STELLE */
for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    document.querySelector('.hero').appendChild(star);
}

/* SI */
function yes(){
    alert("💙 grazie 💙");
}

/* NO che scappa ma resta visibile */
const noBtn = document.getElementById("no");

document.addEventListener("mousemove", function(e){

    const rect = noBtn.getBoundingClientRect();

    const dist = Math.hypot(
        e.clientX - (rect.left + rect.width/2),
        e.clientY - (rect.top + rect.height/2)
    );

    if(dist < 100){

        const maxX = window.innerWidth - 120;
        const maxY = window.innerHeight - 60;

        noBtn.style.left = Math.random()*maxX + "px";
        noBtn.style.top = Math.random()*maxY + "px";
    }
});

</script>

</body>
</html>
