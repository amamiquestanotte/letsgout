<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quando sei libero?</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family: Georgia, serif;
}

.hero{
    width:100vw;
    height:100vh;
    background: linear-gradient(to bottom, #020b1a, #061a3a, #0b2a55);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    position:relative;
}

h1{
    font-size:3rem;
    margin-bottom:30px;
    text-transform:lowercase;
    text-shadow:0 0 10px #5aa7ff;
}

.card{
    background:white;
    border:3px solid #0b2a55;
    border-radius:20px;
    padding:30px;
    width:320px;
    display:flex;
    flex-direction:column;
    gap:18px;
    color:#0b2a55;
    text-align:center;
}

label{
    font-weight:bold;
}

input{
    padding:10px;
    border:2px solid #0b2a55;
    border-radius:10px;
}

button{
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#0b2a55;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    background:yellow;
    border-radius:50%;
    box-shadow:0 0 6px yellow;
}
</style>
</head>

<body>

<div class="hero">

<h1>quando sei libero?</h1>

<div class="card">

    <label>scegli una data</label>
    <input type="date" id="date">

    <label>scegli un orario</label>
    <input type="time" id="time">

    <button onclick="conferma()">conferma</button>

</div>

</div>

<script>

/* STELLINE */
for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');

    star.style.left=Math.random()*100+"%";
    star.style.top=Math.random()*100+"%";

    document.querySelector('.hero').appendChild(star);
}

function conferma(){

    const data = document.getElementById("date").value;
    const ora = document.getElementById("time").value;

    if(!data || !ora){
        alert("scegli data e ora");
        return;
    }

    localStorage.setItem("date", data);
    localStorage.setItem("time", ora);

    window.location.href = "where.html";
}

</script>

</body>
</html>
